[project]
name = "ekko"
version = "0.1.0"
description = "Is it tilt, or is it the queue? A causal study of ranked League of Legends streaks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
crawler = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=16",
]
dbt = [
    "dbt-duckdb>=1.8",
]
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "statsmodels>=0.14",
    "pyfixest>=0.25",
    "matplotlib>=3.8",
]
bayes = [
    "pymc>=5.16",
]
app = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
ai = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crawler", "analysis/src/ekko_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dbt", "app/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
