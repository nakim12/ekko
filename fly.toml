# Phase 1 crawler (see crawler/README.md, "Deploy to Fly.io"). No HTTP service: one long-running
# machine with a volume. Secrets: fly secrets set RIOT_API_KEY=...
app = "ekko-crawler"
primary_region = "ord"  # Chicago, near Riot's NA infrastructure

[build]

[env]
  EKKO_DATA_DIR = "/data"
  RIOT_PLATFORM = "na1"
  RIOT_REGION = "americas"
  RIOT_RATE_LIMITS = "20:1,100:120"

[[mounts]]
  source = "ekko_data"
  destination = "/data"

[[restart]]
  policy = "on-failure"
  retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
