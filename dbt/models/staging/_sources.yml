version: 2

# Raw Riot API data in the `raw` schema of the warehouse. Phase 0 loaded tables there; in Phase 1 the
# loader exposes the crawler's Parquet landing zone (data/raw/) as views with the same names, so these
# models don't change.
sources:
  - name: raw
    description: Immutable raw data written by the crawler. Payloads are the API responses, unchanged.
    tables:
      - name: matches
        description: match-v5 match details, one row per match (`match_id`, `payload` JSON).
      - name: timelines
        description: match-v5 timelines, one row per match (`match_id`, `payload` JSON).
      - name: players
        identifier: phase0_players
        description: >
          Focal players and the league-v4 entry they were sampled from. Phase 0 table for now; the
          Phase 1 sampler replaces it (Phase 0 players are excluded from confirmatory analysis).
