name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[crawler,analysis,dbt,app,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    env:
      EKKO_DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[crawler,dbt,dev]"
      # Real Riot data never goes into git; build on a synthetic warehouse of the same shape.
      - run: python -m tests.fixtures.synthetic_warehouse "$EKKO_DUCKDB_PATH"
      - name: dbt build (Phase 0 sources)
        working-directory: dbt
        run: dbt build --profiles-dir .
      - name: dbt build (Phase 1 sources, Q2 models)
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --vars '{phase: 1}'
      - name: app features match dbt, game by game
        env:
          EKKO_DBT_PARITY_DB: ${{ github.workspace }}/ci.duckdb
        run: pytest -q tests/app/test_dbt_parity.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx next build
      - run: npx tsc --noEmit
