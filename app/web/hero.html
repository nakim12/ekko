<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekko Hero Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #05080f;
      --night: #0b1222;
      --mist: #1b2538;
      --silver: #dce4ef;
      --muted: #8a96a8;
      --gold: #e3c58f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--silver); }
    body { font: 15px/1.6 Inter, system-ui, sans-serif; overflow: hidden; }
    canvas#water {
      position: fixed; inset: 0; width: 100%; height: 100%; display: block;
      background: linear-gradient(to bottom, #04060c 0%, #0d1424 38%, #070b15 39%, #03050a 100%);
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px clamp(16px, 4vw, 48px);
      font-size: 13px; letter-spacing: 0.04em; color: var(--muted);
    }
    nav .wordmark { font: 400 22px "Instrument Serif", serif; letter-spacing: 0.08em; color: var(--silver); }
    nav a { color: var(--muted); text-decoration: none; transition: color .3s; }
    nav a:hover { color: var(--silver); }
    .hero {
      position: relative; z-index: 1; height: 100%;
      display: flex; flex-direction: column; justify-content: flex-start;
      padding: clamp(110px, 17vh, 170px) clamp(16px, 6vw, 96px) 0;
      pointer-events: none;
    }
    .eyebrow {
      font-size: 12px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
      opacity: 0; animation: rise 1.6s .4s ease-out forwards;
    }
    h1 {
      margin: 18px 0 0; max-width: 11ch;
      font: 400 clamp(46px, 7.4vw, 104px)/0.98 "Instrument Serif", serif; letter-spacing: -0.01em;
      opacity: 0; animation: rise 2s .7s ease-out forwards;
    }
    h1 em { color: #fff; }
    .sub {
      margin: 22px 0 0; max-width: 42ch; color: var(--muted);
      opacity: 0; animation: rise 2s 1.1s ease-out forwards;
    }
    .cue {
      position: fixed; z-index: 2; left: 50%; bottom: 28px; transform: translateX(-50%);
      display: grid; justify-items: center; gap: 10px;
      font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted);
      opacity: 0; animation: rise 2s 2s ease-out forwards;
    }
    .cue i { width: 1px; height: 36px; background: linear-gradient(var(--silver), transparent); animation: drip 2.4s ease-in-out infinite; transform-origin: top; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes drip { 0% { transform: scaleY(0); opacity: 1; } 60% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .eyebrow, h1, .sub, .cue { animation: none; opacity: 1; }
      .cue i { animation: none; }
    }
  </style>
</head>
<body>
  <canvas id="water" aria-hidden="true"></canvas>
  <nav>
    <span class="wordmark">ekko</span>
    <a href="https://github.com/nakim12/ekko">github</a>
  </nav>
  <main class="hero">
    <div class="eyebrow">A study of ranked League of Legends</div>
    <h1>Is it <em>tilt</em>, or is it the <em>queue</em>?</h1>
    <p class="sub">Does your last game ripple into your next one? A pre-registered look at losing streaks, with real match data.</p>
  </main>
  <div class="cue">scroll<i></i></div>

  <script>
  (() => {
    const canvas = document.getElementById("water");
    const gl = canvas.getContext("webgl", { antialias: false, premultipliedAlpha: false });
    if (!gl) return; // CSS gradient fallback stays visible

    const MAX_DROPS = 16;
    const vert = `
      attribute vec2 p;
      void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
    const frag = `
      precision highp float;
      uniform vec2 uRes;
      uniform float uTime;
      uniform float uHorizon;
      uniform vec4 uDrops[${MAX_DROPS}]; // x, z, impact time, amplitude
      uniform vec4 uMeteorPath;           // start uv, impact uv
      uniform vec2 uMeteor;               // start time, duration

      const vec3 MOON = vec3(0.45, 0.17, 1.0);

      float hash(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

      // Sparse, faint stars. Most are dim; a few are brighter. They twinkle slowly.
      float stars(vec3 d) {
        if (d.y <= 0.0) return 0.0;
        vec2 sp = d.xy / d.z * 70.0;
        vec2 cell = floor(sp);
        float h = hash(cell);
        if (h < 0.965) return 0.0;
        vec2 pos = vec2(hash(cell + 3.1), hash(cell + 7.7)) * 0.7 + 0.15;
        float core = smoothstep(0.13, 0.0, length(fract(sp) - pos));
        float b = (h - 0.965) / 0.035;
        float twinkle = 0.75 + 0.25 * sin(uTime * (0.6 + 1.8 * hash(cell + 1.3)) + h * 60.0);
        float lift = smoothstep(0.03, 0.26, d.y / d.z);
        return core * (0.18 + 0.8 * b * b) * twinkle * lift;
      }

      vec3 sky(vec3 d, float starAmount) {
        float e = clamp(d.y, 0.0, 1.0);
        vec3 horizon = vec3(0.070, 0.094, 0.150);
        vec3 top = vec3(0.012, 0.018, 0.036);
        vec3 c = mix(horizon, top, pow(clamp(e * 2.6, 0.0, 1.0), 0.55));
        vec3 m = normalize(MOON);
        float md = max(dot(normalize(d), m), 0.0);
        c += vec3(0.80, 0.84, 0.90) * smoothstep(0.99988, 0.99994, md);
        c += vec3(0.50, 0.57, 0.72) * pow(md, 1500.0) * 0.45;
        c += vec3(0.18, 0.23, 0.36) * pow(md, 60.0) * 0.30;
        c += vec3(0.09, 0.12, 0.20) * pow(md, 6.0) * 0.45;
        c += vec3(0.82, 0.86, 0.94) * stars(d) * starAmount * (1.0 - pow(md, 25.0));
        return c;
      }

      // Background swell: always moving, never lit, so the lake reads as calm.
      float swell(vec2 p) {
        float h = 0.0010 * sin(dot(p, vec2(0.6, 1.0)) * 9.0 - uTime * 0.9);
        h += 0.0007 * sin(dot(p, vec2(-0.8, 0.6)) * 14.0 - uTime * 1.2);
        h += 0.0004 * sin(dot(p, vec2(0.2, -1.0)) * 25.0 + uTime * 1.7);
        return h;
      }

      // Rings from drops and the cursor.
      float ripples(vec2 p) {
        float h = 0.0;
        for (int i = 0; i < ${MAX_DROPS}; i++) {
          vec4 d = uDrops[i];
          float age = uTime - d.z;
          if (d.w <= 0.0 || age < 0.0 || age > 9.0) continue;
          float r = length(p - d.xy);
          float s = r - 0.40 * age;
          float w = 0.05 + 0.07 * age;
          float k = 58.0 / (1.0 + 0.22 * age);
          h += d.w * exp(-s * s / (w * w)) * sin(k * s) * exp(-0.5 * age) / (1.0 + 4.0 * r);
        }
        return h;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uRes;
        float aspect = uRes.x / uRes.y;
        vec3 ray = vec3((uv.x - 0.5) * aspect, uv.y - uHorizon, 1.0);
        vec3 col;

        if (ray.y >= 0.0) {
          col = sky(ray, 1.0);
        } else {
          float t = 1.0 / -ray.y;               // camera at height 1 above the water
          vec2 p = vec2(ray.x * t, t);          // world x, z on the water plane
          float e = 0.004;
          float fade = exp(-0.07 * t);
          float s0 = swell(p), r0 = ripples(p);
          vec2 gs = vec2(swell(p + vec2(e, 0.0)) - s0, swell(p + vec2(0.0, e)) - s0) / e;
          vec2 gr = vec2(ripples(p + vec2(e, 0.0)) - r0, ripples(p + vec2(0.0, e)) - r0) / e;
          gs *= fade; gr *= fade;
          vec2 g = gs + gr;
          vec3 n = normalize(vec3(-g.x, 1.0, -g.y));
          vec3 v = normalize(ray);
          vec3 rd = reflect(v, n);
          rd.y = abs(rd.y);
          float fres = 0.02 + 0.98 * pow(1.0 - max(dot(-v, n), 0.0), 5.0);
          vec3 deep = vec3(0.008, 0.013, 0.026);
          col = mix(deep, sky(rd, 0.55), fres);
          // Art-directed sheen: ring faces turned toward the moon catch a little light,
          // so rings stay readable outside the moonlight.
          vec2 toMoon = normalize(vec2(0.45, 1.0));
          float facing = -dot(gr, toMoon);
          col += vec3(0.48, 0.56, 0.72) * clamp(facing * 1.9, 0.0, 0.36);
          col += vec3(0.30, 0.36, 0.50) * clamp(length(gr) * 0.5, 0.0, 0.10);
          col *= 1.0 - clamp(-facing * 1.2, 0.0, 0.4);
          float glint = pow(max(dot(normalize(rd), normalize(MOON)), 0.0), 2600.0);
          col += vec3(0.95, 0.82, 0.58) * glint * 1.4;
          float fog = 1.0 - exp(-t * 0.045);
          col = mix(col, sky(vec3(ray.x, 0.002, 1.0), 0.0), fog * 0.55);
        }

        float px = uRes.y / 630.0; // keep sizes consistent across screens

        // Impact flashes: a brief point of light where the water is touched.
        for (int i = 0; i < ${MAX_DROPS}; i++) {
          vec4 d = uDrops[i];
          float age = uTime - d.z;
          if (d.w < 0.004 || age < 0.0 || age > 0.6) continue;
          vec2 s = vec2(0.5 + d.x / (aspect * d.y), uHorizon - 1.0 / d.y);
          vec2 q = (uv - s) * uRes / px;
          float big = step(0.009, d.w);
          float size = (1.5 + 4.0 / d.y) * (1.0 + age * 5.0) * (1.0 + big);
          float glow = exp(-(q.x * q.x) / (size * size) - (q.y * q.y) / (size * size * 0.35));
          vec3 tint = mix(vec3(0.80, 0.86, 0.96), vec3(1.0, 0.84, 0.56), big);
          col += tint * glow * exp(-age * (9.0 - 5.0 * big)) * (0.7 + big);
        }

        // Shooting star: accelerates along its path, a fading gold-white tail behind the head.
        float mt = (uTime - uMeteor.x) / uMeteor.y;
        if (mt > 0.0 && mt < 1.0) {
          vec2 p0 = uMeteorPath.xy * uRes, p1 = uMeteorPath.zw * uRes;
          vec2 dir = normalize(p1 - p0);
          vec2 head = mix(p0, p1, mt * mt);
          vec2 rel = gl_FragCoord.xy - head;
          float along = -dot(rel, dir);
          float perp = abs(rel.x * dir.y - rel.y * dir.x) / px;
          float tail = 210.0 * px * (0.35 + 0.65 * mt);
          float fadeIn = smoothstep(0.0, 0.12, mt);
          if (along > -2.0 * px && along < tail) {
            float f = 1.0 - clamp(along / tail, 0.0, 1.0);
            col += vec3(1.0, 0.90, 0.72) * exp(-perp * perp / (0.6 + 1.6 * f)) * f * f * 0.9 * fadeIn;
          }
          col += vec3(1.0, 0.95, 0.85) * exp(-dot(rel, rel) / (10.0 * px * px)) * 1.2 * fadeIn;
        }

        vec2 c = uv - 0.5;
        col *= 1.0 - dot(c, c) * 0.55;
        col += (hash(gl_FragCoord.xy + fract(uTime)) - 0.5) / 255.0 * 2.0;
        gl_FragColor = vec4(col, 1.0);
      }`;

    function compile(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog);
    gl.useProgram(prog);

    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes = gl.getUniformLocation(prog, "uRes");
    const uTime = gl.getUniformLocation(prog, "uTime");
    const uHorizon = gl.getUniformLocation(prog, "uHorizon");
    const uDrops = gl.getUniformLocation(prog, "uDrops");
    const uMeteorPath = gl.getUniformLocation(prog, "uMeteorPath");
    const uMeteor = gl.getUniformLocation(prog, "uMeteor");

    const drops = new Float32Array(MAX_DROPS * 4);
    let slot = 0;
    const addDrop = (x, z, at, amp) => {
      drops.set([x, z, at, amp], slot * 4);
      slot = (slot + 1) % MAX_DROPS;
    };

    let horizon = 0.62;
    const resize = () => {
      const scale = Math.min(devicePixelRatio || 1, 1.5) * 0.7; // water is soft; render below native and upscale
      canvas.width = Math.round(innerWidth * scale);
      canvas.height = Math.round(innerHeight * scale);
      gl.viewport(0, 0, canvas.width, canvas.height);
      horizon = innerWidth < 700 ? 0.5 : 0.62;
    };
    resize();
    addEventListener("resize", resize);

    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const start = performance.now();
    const now = () => (performance.now() - start) / 1000;

    // Rain: a drop every few seconds, mostly near the moon's reflection.
    let nextDrop = 0.8;
    const scheduleRain = (t) => {
      while (t > nextDrop) {
        const z = 2.0 + Math.random() * 2.2;
        const x = 0.45 * z + (Math.random() - 0.5) * 1.3;
        addDrop(x, z, nextDrop, 0.006);
        nextDrop += 2.6 + Math.random() * 1.8;
      }
    };

    // Shooting star: rare. Once early so first-time visitors see it, then every 25-40 s.
    const meteorPath = new Float32Array(4);
    const meteorTime = new Float32Array([-100, 1]);
    let nextMeteor = 6;
    const scheduleMeteor = (t) => {
      if (t < nextMeteor) return;
      const aspect = innerWidth / innerHeight;
      const z = 3.5 + Math.random() * 1.5;
      const sx = 0.6 + Math.random() * 0.25;
      const x = (sx - 0.5) * aspect * z;
      const end = [sx, horizon - 1 / z];
      const startPt = [Math.max(0.05, sx - 0.24 - Math.random() * 0.12), Math.min(0.97, horizon + 0.3)];
      meteorPath.set([...startPt, ...end]);
      const duration = 1.1;
      meteorTime.set([t, duration]);
      addDrop(x, z, t + duration, 0.011);
      nextMeteor = t + 25 + Math.random() * 15;
    };

    // Cursor ripples
    const toWater = (cx, cy) => {
      const sx = cx / innerWidth, sy = 1 - cy / innerHeight;
      if (sy > horizon - 0.02) return null;
      const z = 1 / (horizon - sy);
      return [(sx - 0.5) * (innerWidth / innerHeight) * z, z];
    };
    let last = null, lastAt = 0;
    addEventListener("pointermove", (e) => {
      const w = toWater(e.clientX, e.clientY);
      const t = now();
      if (!w || t - lastAt < 0.07) return;
      if (last && Math.hypot(w[0] - last[0], w[1] - last[1]) < 0.08) return;
      addDrop(w[0], w[1], t, 0.0018);
      last = w; lastAt = t;
    });
    addEventListener("pointerdown", (e) => {
      const w = toWater(e.clientX, e.clientY);
      if (w) addDrop(w[0], w[1], now(), 0.006);
    });

    const draw = (t) => {
      gl.uniform2f(uRes, canvas.width, canvas.height);
      gl.uniform1f(uTime, t);
      gl.uniform1f(uHorizon, horizon);
      gl.uniform4fv(uDrops, drops);
      gl.uniform4fv(uMeteorPath, meteorPath);
      gl.uniform2fv(uMeteor, meteorTime);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    // Test hook: ?at=7.2 renders the single frame at that time (used for screenshots).
    const at = parseFloat(new URLSearchParams(location.search).get("at"));
    if (!Number.isNaN(at)) {
      for (let t = 0; t <= at; t += 0.05) { scheduleRain(t); scheduleMeteor(t); }
      draw(at);
      addEventListener("resize", () => draw(at));
      return;
    }

    if (reduce) {
      addDrop(0.95, 2.6, -1.4, 0.006);
      draw(0);
      addEventListener("resize", () => draw(0));
      return;
    }
    const frame = () => {
      const t = now();
      scheduleRain(t);
      scheduleMeteor(t);
      draw(t);
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
